name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gateway-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GATEWAY_DB_URL: "sqlite:///:memory:"
      REDIS_HOST: localhost
      JWT_SECRET: ci-test-secret
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318/v1/traces"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Run tests
        working-directory: backend
        run: pytest --cov=core --cov=routes --cov-report=term-missing

  users-service-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: users
          POSTGRES_PASSWORD: users
          POSTGRES_DB: users_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U users -d users_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318/v1/traces"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/users-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: services/users-service
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: services/users-service
        run: ruff check .

      - name: Run tests (in-memory SQLite; see tests/conftest.py)
        working-directory: services/users-service
        run: pytest --cov=app --cov-report=term-missing

  posts-service-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: posts
          POSTGRES_PASSWORD: posts
          POSTGRES_DB: posts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U posts -d posts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318/v1/traces"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/posts-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: services/posts-service
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: services/posts-service
        run: ruff check .

      - name: Run tests (in-memory SQLite; see tests/conftest.py)
        working-directory: services/posts-service
        run: pytest --cov=app --cov-report=term-missing

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [gateway-test, users-service-test, posts-service-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build gateway image
        run: docker build -t flask-microservice-api-gateway-backend ./backend

      - name: Build users-service image
        run: docker build -t flask-microservice-api-gateway-users-service ./services/users-service

      - name: Build posts-service image
        run: docker build -t flask-microservice-api-gateway-posts-service ./services/posts-service

      - name: Build frontend image
        run: docker build -t flask-microservice-api-gateway-frontend ./frontend
